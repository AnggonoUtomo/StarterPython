[project]
name = "starterpython"
version = "0.1.0"
description = "Production-oriented FastAPI modular monolith starterkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi[standard]>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<7",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "structlog>=25,<26",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.400,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starterpython"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
